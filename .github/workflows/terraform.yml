
name: Terraform AWS OIDC Troubleshooting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Get GitHub OIDC token and inspect claims BEFORE AWS login
      - name: Debug GitHub OIDC Claims
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -er '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2 | tr '_-' '/+')
          PAYLOAD=$(printf '%s' "$PAYLOAD" | awk '{
            while (length($0) % 4) $0 = $0 "="
            print
          }')

          printf '%s' "$PAYLOAD" | base64 -d | jq '{iss, sub, aud}'

      # 3. Authenticate with AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::466210119847:role/vpc-main
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      # 4. Verify AWS identity
      - name: Verify AWS Identity
        run: aws sts get-caller-identity
